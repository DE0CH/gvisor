# merge.yml — when a workflow on a branch finishes, the gate decides (gate.yml): every workflow on the head commit green
# → main moves to that commit; one red → the `gate` status is red. workflow_run runs main's copy of this file, so a
# branch can't change it (this file and the gate.yml it calls are main's copies). `workflows` names the repo's CI (every
# workflow that tests a branch push); `with: workflows` repeats it: the gate counts those runs only. Its deploy key is
# the `merge` environment's secret, read here and nowhere else.
name: merge
on:
  workflow_run:
    workflows: [branch, CI]
    types: [completed]
permissions: { contents: read, pull-requests: write, statuses: write, actions: read }
concurrency: { group: "merge-${{ github.event.workflow_run.head_branch }}", cancel-in-progress: false }
jobs:
  gate:
    if: >-
      github.event.workflow_run.head_branch != github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: ./.github/workflows/gate.yml
    with: { command: merge, branch: "${{ github.event.workflow_run.head_branch }}", sha: "${{ github.event.workflow_run.head_sha }}",
            workflows: "branch, CI" }
