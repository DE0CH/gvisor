# merge.yml — when a workflow of the repo's CI finishes on a branch, the gate decides (DE0CH/jarvis4 rust/gate): every
# workflow on the head commit green → into main (a fast-forward on main's head, else main merged in cleanly), the
# branch deleted; one red → the `gate` status red. workflow_run runs main's copy of this file, so a branch can't
# change it; the job's deploy key is the `merge` environment's secret, which admits main only. `workflows` names the
# repo's CI; GATE_WORKFLOWS repeats it: the gate counts those runs only.
name: merge
on:
  workflow_run:
    workflows: [branch, CI]
    types: [completed]
permissions: { contents: read, pull-requests: write, statuses: write, actions: read }
concurrency: { group: "merge-${{ github.event.workflow_run.head_branch }}", cancel-in-progress: false }
jobs:
  merge:
    if: >-
      github.event.workflow_run.head_branch != github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: merge
    steps:
      - name: the gate binary (DE0CH/jarvis4 rust/gate/pin.txt names it and its sha256)
        id: bin
        run: |
          set -e
          pin="$(curl -fsSL https://raw.githubusercontent.com/DE0CH/jarvis4/main/rust/gate/pin.txt || true)"
          read -r sum url <<< "$pin"
          if [ -z "$pin" ] || [ "$sum" = unreleased ]; then
            echo "::warning::the gate is not released yet (DE0CH/jarvis4 rust/gate/pin.txt)"
            echo ready=0 >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsSL -o gate "$url"
          echo "$sum  gate" | sha256sum -c -
          chmod +x gate
          echo ready=1 >> "$GITHUB_OUTPUT"
      - if: steps.bin.outputs.ready == '1'
        run: ./gate merge
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GATE_SHA: ${{ github.event.workflow_run.head_sha }}
          GATE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GATE_WORKFLOWS: "branch, CI"
          MERGE_DEPLOY_KEY: ${{ secrets.MERGE_DEPLOY_KEY }}
